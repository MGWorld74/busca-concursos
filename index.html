<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Concursos — concursos públicos por âmbito</title>
<meta name="description" content="Concursos públicos federais, estaduais e municipais do Brasil, com editais abertos, previstos e notícias.">
<link rel="icon" type="radar-icone.png" href="favicon.png">
<style>
:root{--bg:#f2f6f3;--card:#fff;--ink:#0d1b2e;--muted:#465a6d;--line:#cbd8d0;--soft:#e4f1e8;--field:#eef4ef;--brand:#00692c;--blue:#002776}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.banner{display:block;width:100%;height:auto;border-radius:12px;margin-top:16px}
main{padding-bottom:30px}

/* barra fixa (abas + filtros) */
.sticky{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 0 12px;box-shadow:0 6px 8px -8px rgba(0,39,118,.35)}
.sticky .seg{margin-top:0}
/* abas de âmbito */
.seg{display:flex;gap:6px;background:var(--soft);border-radius:12px;padding:4px;margin-top:14px}
.seg button{flex:1;background:#d6e3da;border:0;border-radius:9px;padding:10px 8px;font-weight:700;color:#2b3f50}
.seg button:hover,.seg button.on{background:var(--brand);color:#fff}

/* filtros */
.filters{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px 14px;margin-top:14px}
.fld{flex:1 1 150px;max-width:260px}
.fld label{display:block;font-size:12px;font-weight:600;color:#33475a;margin-bottom:4px}
select,input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:inherit}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:-1px}
.fld a{display:inline-block;margin-top:4px;font-size:12.5px;color:var(--blue)}
.btns{display:flex;gap:8px;margin-top:19px}
button{font:inherit;cursor:pointer}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:var(--soft);color:var(--brand);border:1px solid var(--line)}

/* resultados */
.msg{color:var(--muted);font-size:13px;margin:18px 2px 0;min-height:18px}
.total{margin:12px 2px 0}
.total b{font-size:15px}
.sec{margin-top:22px}
.sec summary{cursor:pointer;list-style:none;padding:2px}
.sec summary::-webkit-details-marker{display:none}
.sec summary::before{content:"▸ ";color:var(--brand)}
.sec[open]>summary::before{content:"▾ "}
.sub{display:inline;margin:0;font-size:15px}
.sec summary+*{margin-top:8px}
.more{display:block;margin:14px auto 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(0,39,118,.06),0 6px 20px rgba(0,39,118,.07);display:flex;flex-direction:column;gap:10px}
.card.fresh{border-top-color:#ffdf00;background:#fffdf2}
.tags{display:flex;gap:6px;align-items:center}
.sel{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#ffdf00;color:#002776}
.card h3{margin:0;font-size:15.5px;line-height:1.35}
.card h3 a{color:inherit;text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;color:#fff}
.t-Abertura{background:#00692c}.t-Previsto{background:#002776}.t-Alteração{background:#ffdf00;color:#002776}.t-Resultado{background:#1a56b0}.t-Notícia{background:#566577}
.pill{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.meta{margin:0;color:var(--muted);font-size:13px}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.news li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.news a{color:var(--brand);font-weight:600;text-decoration:none}
.news a:hover{text-decoration:underline}
.news .meta{display:inline;font-size:12px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 30px}
@media(min-width:601px){.fld.sort{max-width:200px}}
@media(max-width:600px){
  .sticky{position:static;box-shadow:none}
  .fld{max-width:none}
  .btns{width:100%;margin-top:4px}.btns .btn{flex:1}
}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <img class="banner" src="radarconcursos.png" alt="Radar Concursos — monitorando seu próximo concurso">
</div>

<main class="wrap">
  <div class="sticky">
  <div class="seg" id="seg" role="tablist" aria-label="Âmbito">
    <button data-scope="nacional" class="on" role="tab">🇧🇷 Nacional</button>
    <button data-scope="estadual" role="tab">🏛️ Estadual</button>
    <button data-scope="municipal" role="tab">🏙️ Municipal</button>
  </div>

  <div class="filters">
    <div class="fld" id="wUf" hidden>
      <label for="fUf">Estado (UF)</label>
      <select id="fUf"></select>
    </div>
    <div class="fld" id="wMun" hidden>
      <label for="fMun">Município</label>
      <select id="fMun" disabled></select>
      <input type="text" id="fMunManual" placeholder="Nome do município" autocomplete="off" hidden>
    </div>
    <div class="fld">
      <label for="fTipo">Tipo</label>
      <select id="fTipo"><option value="">Todos</option><option>Abertura</option><option>Previsto</option><option>Alteração</option><option>Resultado</option><option>Notícia</option></select>
    </div>
    <div class="fld">
      <label for="fMod">Modalidade</label>
      <select id="fMod"><option value="">Todas</option><option>Concurso</option><option>Processo seletivo</option><option>Estágio</option></select>
    </div>
    <div class="fld">
      <label for="fEsc">Escolaridade</label>
      <select id="fEsc"><option value="">Todas</option><option>Fundamental</option><option>Médio</option><option>Técnico</option><option>Superior</option></select>
    </div>
    <div class="fld sort" id="wSort">
      <label for="fSort">Ordenar por</label>
      <select id="fSort"><option value="rec">Mais recentes</option><option value="vagas">Mais vagas</option><option value="sal">Maior salário</option></select>
    </div>
    <div class="btns">
      <button class="btn" id="goBtn">Atualizar</button>
      <button class="btn ghost" id="clearBtn">Limpar</button>
    </div>
  </div>
  </div>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <div id="result" hidden>
    <p class="total"><b id="total">0</b> <span id="totalTxt">resultados</span></p>
    <details class="sec" id="wAberto" open hidden><summary><h2 class="sub">📢 Edital Aberto <b id="nAberto"></b></h2></summary><div class="grid" id="lAberto"></div><button class="btn ghost more" id="mAberto" data-more="aberto" hidden></button></details>
    <details class="sec" id="wPrevisto" open hidden><summary><h2 class="sub">🕓 Edital Previsto <b id="nPrevisto"></b></h2></summary><div class="grid" id="lPrevisto"></div><button class="btn ghost more" id="mPrevisto" data-more="previsto" hidden></button></details>
    <details class="sec" id="wNoticias" open hidden><summary><h2 class="sub">📰 Notícias e links (resultados, alterações e avisos) <b id="nNoticias"></b></h2></summary><ul class="news" id="lNoticias"></ul><button class="btn ghost more" id="mNoticias" data-more="noticias" hidden></button></details>
  </div>
</main>

<footer>Ferramenta independente, sem vínculo com órgãos, bancas ou portais citados.</footer>

<script>
(function(){
'use strict';

/* ---------- dados e utilitários ---------- */
const UFNAMES = {AC:'Acre',AL:'Alagoas',AP:'Amapá',AM:'Amazonas',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MT:'Mato Grosso',MS:'Mato Grosso do Sul',MG:'Minas Gerais',PA:'Pará',PB:'Paraíba',PR:'Paraná',PE:'Pernambuco',PI:'Piauí',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',RS:'Rio Grande do Sul',RO:'Rondônia',RR:'Roraima',SC:'Santa Catarina',SP:'São Paulo',SE:'Sergipe',TO:'Tocantins'};
const UFS = Object.keys(UFNAMES);
const $ = s => document.querySelector(s);
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NAME_LIST = UFS.filter(u => u !== 'PA').map(u => [u, norm(UFNAMES[u])]).sort((a,b) => b[1].length - a[1].length);
const UFRX = UFS.map(u => u.toLowerCase()).join('|');
const DAYS = 30;

function relTime(ts){
  if(!ts) return '—';
  const m = Math.round((Date.now()-ts)/60000);
  if(m < 60) return 'há '+Math.max(m,1)+' min';
  const h = Math.round(m/60); if(h < 24) return 'há '+h+' h';
  const d = Math.round(h/24); if(d < 30) return 'há '+d+' dia'+(d>1?'s':'');
  return new Date(ts).toLocaleDateString('pt-BR');
}
function hash(s){ let h = 5381; for(let i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))|0; return 'i'+(h>>>0).toString(36); }

/* ---------- classificação (mesma lógica do script Python) ---------- */
const RX_CONC = /\b(concursos?|edital|editais|vagas?|selecao|selecoes|processo seletivo|teste seletivo|inscricoes|certame|gabarito\w*|convoca\w*|nomea\w*|nomeados|aprovados|classificad\w*|cadastro reserva|banca|provas?|estagio|residencia|chamamento|homologa\w*)\b/;
const RX_MUN = /\b(?:prefeitura|camara municipal|camara de vereadores|guarda (?:civil )?municipal|secretaria municipal|autarquia municipal|fundacao municipal|iprem|municipio de|camara de (?!deputados)\w)/;
const RX_EST = new RegExp('\\b(?:governo (?:do estado|estadual)|secretaria (?:de estado|estadual)|assembleia legislativa|camara legislativa|policia (?:militar|civil|penal)|corpo de bombeiros|tribunal de justica|tribunal de contas do estado|defensoria publica do estado|ministerio publico do estado|procuradoria geral do estado|detran|sefaz|seplag|seduc|sesau?|estaduais?|uerj|uenf|uems|uepa|unesp|unicamp|usp)\\b|\\b(?:pm|pc|cbm|tj|mp|dpe|tce|pge)e?[ -]?(?:'+UFRX+')\\b');
const RX_FED = new RegExp('\\b(?:federal|federais|(?:da|de) uniao|nacional unificado|inss|receita|banco do brasil|caixa|petrobras|correios|bndes|ibge|ibama|icmbio|anvisa|anatel|aneel|antt|cvm|banco central|bacen|trf\\d?|trt\\d*|tre|tse|tst|stf|stj|stm|cnj|cnmp|mpu|mpf|mpt|mpm|dpu|agu|prf|funai|fiocruz|ebserh|senado|camara dos deputados|tcu|cgu|cnu|exercito|marinha|aeronautica|serpro|dataprev|embrapa|capes|cnpq|ipea|inep|ministerio (?:da|do|de|dos|das))\\b|\\b(?:if|uf)(?:'+UFRX+')\\b');
const RX_ALT = /\b(retifica\w*|altera\w*|prorroga\w*|reabre\w*|reabertura|suspende\w*|suspens\w*|cancela\w*|adia\w*|anula\w*|errata)\b/;
const RX_RES = /\b(gabarito\w*|resultado\w*|classificad\w*|classificacao|homologa\w*|convoca\w*|convocacao|nomea\w*|aprovad\w*|nota final|notas|chamamento)\b/;
const RX_PREV = /\b(autoriza\w*|previst\w*|preve\w*|comissao|banca (definida|escolhida|contratada)|solicita\w*|pedido|em breve|planeja\w*|deve abrir|sera aberto|anuncia\w*)\b/;
const RX_ABR = /\b(abre\w*|abertas?|edital|lanca\w*|publica\w*|inscricoes|vagas?|oferece\w*|seleciona\w*|contrata\w*)\b/;
const MUN_ORG = /^(?:prefeitura|c[aâ]mara(?: municipal)?)\s+(?:municipal\s+)?d[aeo]s?\s+(.+)$/i;

const tipoOf = n => RX_ALT.test(n) ? 'Alteração' : RX_RES.test(n) ? 'Resultado' : RX_PREV.test(n) ? 'Previsto' : RX_ABR.test(n) ? 'Abertura' : 'Notícia';
const modalidadeOf = n => /\bestagio\b/.test(n) ? 'Estágio' : /(processo seletivo|teste seletivo|selecao|selecoes)/.test(n) ? 'Processo seletivo' : 'Concurso';
function escolaridadeOf(n){
  const out = [];
  if(/fundamental/.test(n)) out.push('Fundamental');
  if(/(ensino medio|nivel medio|\bmedio\b)/.test(n)) out.push('Médio');
  if(/tecnico/.test(n)) out.push('Técnico');
  if(/superior/.test(n)) out.push('Superior');
  return out;
}
function extractUf(t){
  let m = /\s[-–]\s([A-Z]{2})\b/.exec(t);
  if(m && UFS.includes(m[1])) return m[1];
  m = /[\/(]([A-Z]{2})(?=[)\s,.:;]|$)/.exec(t) || /\b[A-Z]{2,6}-([A-Z]{2})\b/.exec(t) || /\b[^\s-]{2,}-([A-Z]{2})\b/.exec(t);
  if(m && UFS.includes(m[1])) return m[1];
  const n = norm(t);
  for(const [uf,name] of NAME_LIST){ if(n.includes(name)) return uf; }
  const re = /\b([A-Z]{2})\b/g;
  while((m = re.exec(t))){ if(UFS.includes(m[1])) return m[1]; }
  return '';
}
function extractOrgao(t){
  let m = /^(.+?)\s[-–]\s([A-Z]{2})\b/.exec(t);
  if(m && UFS.includes(m[2]) && m[1].length <= 90) return m[1].trim();
  m = /^(.+?)\s+(abre|abrem|reabre|retifica|publica|divulga|divulgam|autoriza|prorroga|altera|convoca|lança|anuncia|suspende|cancela|homologa|oferece|seleciona|contrata|realiza|promove|inicia|nomeia|chama|encerra|tem|terá|divulgou|abriu|libera|define|recebe|prevê|solicita)\b/i.exec(t);
  return m && m[1].length <= 80 ? m[1].trim() : '';
}
function extractCargos(t){
  const m = /\bpara\s+(.+?)(?:\s+com\s+(?:sal|vaga)|\s+e\s+cadastro|$)/i.exec(t);
  return m ? m[1].trim().slice(0,110) : '';
}
function money(s){
  const v = Array.from(s.matchAll(/R\$\s?([\d.]+(?:,\d{1,2})?)/g)).map(m => parseFloat(m[1].replace(/\./g,'').replace(',','.')));
  return v.length ? Math.max(...v) : 0;
}
function scopeOf(n, temUf){
  if(RX_MUN.test(n)) return 'municipal';
  if(RX_EST.test(n)) return 'estadual';
  if(RX_FED.test(n)) return 'nacional';
  return temUf ? 'estadual' : '';
}

/* cria um item; devolve null se não for concurso ou se não der para definir o âmbito */
function make(rawTitle, fonte, link, ts, ctxUf){
  let titulo = String(rawTitle || '').trim();
  fonte = String(fonte || '').trim();
  if(fonte && titulo.endsWith(' - '+fonte)) titulo = titulo.slice(0, -(fonte.length+3)).trim();
  const n = norm(titulo);
  if(!titulo || !RX_CONC.test(n)) return null;
  const orgao = extractOrgao(titulo), ufTitulo = extractUf(titulo);
  const scope = scopeOf(norm(titulo+' '+orgao+' '+fonte), !!ufTitulo);
  if(!scope) return null;
  let municipio = '';
  if(scope === 'municipal'){
    const m = MUN_ORG.exec(orgao) || MUN_ORG.exec(fonte);
    municipio = m ? m[1].trim() : '';
  }
  const vm = /(\d[\d.]*)\s+vagas?/i.exec(titulo);
  return {
    vagas: vm ? parseInt(vm[1].replace(/\./g,''),10) || 0 : 0, salario: money(titulo),
    id: hash(n), titulo, orgao, fonte, scope, municipio,
    uf: ufTitulo || (scope === 'estadual' && ctxUf) || '',
    tipo: tipoOf(n), modalidade: modalidadeOf(n), escolaridade: escolaridadeOf(n),
    cargos: extractCargos(titulo), link: link || '', ts: ts || 0,
    txt: norm(titulo+' '+orgao+' '+fonte)
  };
}

/* ---------- dados: concursos.json (robô) + busca ao vivo (Google Notícias) ---------- */
const pool = new Map();
const add = it => { if(it) pool.set(it.id, it); };

async function loadBase(){
  try{
    const res = await fetch('concursos.json?'+Date.now());
    if(!res.ok) return false;
    const data = await res.json();
    (data.itens || []).forEach(o => add(make(o.titulo, o.fonte, o.link, Date.parse(o.ts), o.uf)));
    return true;
  }catch(e){ return false; }
}

const PROXIES = [
  {u:'https://api.allorigins.win/raw?url=', json:false},
  {u:'https://corsproxy.io/?url=', json:false},
  {u:'https://api.codetabs.com/v1/proxy/?quest=', json:false},
  {u:'https://api.rss2json.com/v1/api.json?rss_url=', json:true}
];
const feedUrl = q => 'https://news.google.com/rss/search?q='+encodeURIComponent(q)+'&hl=pt-BR&gl=BR&ceid=BR:pt-419';
function readXml(xml){
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  if(!doc.querySelector('rss')) throw new Error('resposta inválida');
  return Array.from(doc.querySelectorAll('item')).map(i => {
    const g = t => { const e = i.querySelector(t); return e ? e.textContent : ''; };
    return {title:g('title'), source:g('source'), link:g('link'), date:g('pubDate')};
  });
}
function readJson(d){
  if(!d || d.status !== 'ok' || !Array.isArray(d.items)) throw new Error('resposta inválida');
  return d.items.map(i => {
    let title = i.title || '', source = '';
    const m = /^(.*\S)\s[-–]\s([^-–]{2,40})$/.exec(title);
    if(m){ title = m[1]; source = m[2].trim(); }
    return {title, source, link:i.link, date:(i.pubDate || '').replace(' ','T')+'Z'};
  });
}
function getRaw(url){
  return Promise.any(PROXIES.map(async p => {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
    try{
      const res = await fetch(p.u+encodeURIComponent(url), {signal: ctl.signal});
      if(!res.ok) throw new Error('HTTP '+res.status);
      return p.json ? readJson(await res.json()) : readXml(await res.text());
    }finally{ clearTimeout(t); }
  }));
}
async function fetchFeed(q, ctxUf){
  const raw = await getRaw(feedUrl(q));
  return {lidas: raw.length, items: raw.map(r => make(r.title, r.source, r.link, Date.parse(r.date), ctxUf)).filter(Boolean)};
}
function queries(scope, uf, mun){
  const nome = UFNAMES[uf] || '';
  let q;
  if(scope === 'nacional') q = ['concurso público federal edital', 'concurso público nacional inscrições abertas'];
  else if(scope === 'estadual') q = uf ? ['concurso público governo do estado '+nome, 'concurso público '+nome+' edital inscrições'] : ['concurso público governo do estado edital'];
  else q = mun ? ['concurso público prefeitura de '+mun+' '+nome, 'prefeitura de '+mun+' edital inscrições '+nome] : ['concurso público prefeituras '+nome+' edital'];
  return q.map(x => x+' when:'+DAYS+'d');
}

/* ---------- municípios (IBGE) ---------- */
const cacheMun = {};
let muniTk = 0;
async function loadMunicipios(uf){
  const sel = $('#fMun'), tk = ++muniTk;
  if(!uf){ sel.innerHTML = '<option value="">Selecione o estado primeiro…</option>'; sel.disabled = true; return; }
  sel.innerHTML = '<option value="">Carregando…</option>'; sel.disabled = true;
  try{
    if(!cacheMun[uf]){
      const res = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados/'+uf+'/municipios');
      if(!res.ok) throw new Error('HTTP '+res.status);
      cacheMun[uf] = (await res.json()).map(m => m.nome).sort((a,b) => a.localeCompare(b,'pt-BR'));
    }
    if(tk !== muniTk) return;
    sel.innerHTML = '<option value="">Todos os municípios</option>' + cacheMun[uf].map(n => '<option>'+esc(n)+'</option>').join('');
    sel.disabled = false;
  }catch(e){
    if(tk !== muniTk) return;
    sel.innerHTML = '<option value="">Lista indisponível</option>';
    manual(true);
  }
}
function manual(on){
  $('#fMun').hidden = on; $('#fMunManual').hidden = !on;
}
const getMun = () => ($('#fMunManual').hidden ? $('#fMun').value : $('#fMunManual').value).trim();

/* ---------- âmbito e filtros ---------- */
let scope = 'nacional';

function clearResults(texto){
  $('#result').hidden = true;
  $('#msg').textContent = texto || (scope === 'municipal' ? 'Selecione um estado e clique em Atualizar.' : 'Escolha os filtros e clique em Atualizar.');
}
function reset(){
  $('#fUf').value = ''; $('#fMunManual').value = ''; manual(false); loadMunicipios('');
  ['fTipo','fMod','fEsc'].forEach(id => $('#'+id).value = '');
  $('#fSort').value = 'rec';
  clearResults();
}
function setScope(s){
  scope = s;
  document.querySelectorAll('#seg button').forEach(b => {
    const on = b.dataset.scope === s; b.classList.toggle('on', on); b.setAttribute('aria-selected', on);
  });
  $('#wUf').hidden = s === 'nacional';
  $('#wMun').hidden = s !== 'municipal';
  $('#wSort').hidden = s === 'municipal';
  $('#fUf').options[0].text = s === 'estadual' ? 'Todos' : 'Selecione…';
  reset();
}

/* ---------- exibição ---------- */
function filtrar(uf, mun){
  const tipo = $('#fTipo').value, mod = $('#fMod').value, esc = $('#fEsc').value, ord = $('#fSort').value;
  const corte = Date.now() - DAYS*864e5, m = norm(mun);
  return Array.from(pool.values()).filter(it => {
    if(it.scope !== scope) return false;
    if(it.ts && it.ts < corte) return false;
    if(tipo && it.tipo !== tipo) return false;
    if(mod && it.modalidade !== mod) return false;
    if(esc && !it.escolaridade.includes(esc)) return false;
    if(scope === 'estadual' && uf && it.uf !== uf) return false;
    if(scope === 'municipal'){
      if(it.uf && it.uf !== uf) return false;
      if(m) return it.txt.includes(m);
      if(!it.uf){   // sem UF no título: confere se o município pertence ao estado escolhido
        const nomes = cacheMun[uf] || [];
        return !!it.municipio && nomes.some(n => norm(n) === norm(it.municipio));
      }
    }
    return true;
  }).sort((a,b) => (ord === 'vagas' ? b.vagas - a.vagas : ord === 'sal' ? b.salario - a.salario : 0) || b.ts - a.ts);
}
const SCOPE_LABEL = {nacional:'Nacional', estadual:'Estadual', municipal:'Municipal'};
const safeLink = u => /^https?:\/\//i.test(u) ? esc(u) : '';

const brl = n => n.toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});
function cardHtml(it){
  const meta = [it.orgao, it.uf, it.fonte].filter(Boolean).map(esc).join(' · ');
  const extra = [it.vagas ? it.vagas.toLocaleString('pt-BR')+' vagas' : '', it.salario ? 'até '+brl(it.salario) : ''].filter(Boolean).join(' · ');
  const novo = it.ts && Date.now()-it.ts < 864e5;
  const href = safeLink(it.link);
  return '<article class="card'+(novo ? ' fresh' : '')+'">'
    + '<div class="row"><h3>'+(href ? '<a href="'+href+'" target="_blank" rel="noopener">'+esc(it.titulo)+'</a>' : esc(it.titulo))+'</h3>'
    + '<span class="badge t-'+it.tipo+'">'+it.tipo+'</span></div>'
    + '<div class="tags"><span class="pill">'+SCOPE_LABEL[it.scope]+'</span>'+(novo ? '<span class="sel">NOVO</span>' : '')+'</div>'
    + (meta ? '<p class="meta">'+meta+'</p>' : '')
    + (extra ? '<p class="meta">'+esc(extra)+'</p>' : '')
    + (it.cargos ? '<p class="meta">Cargos: '+esc(it.cargos)+'</p>' : '')
    + '<p class="meta">Publicado '+relTime(it.ts)+'</p>'
    + '</article>';
}
function newsHtml(it){
  const href = safeLink(it.link);
  const meta = [it.fonte, it.uf, relTime(it.ts)].filter(Boolean).map(esc).join(' · ');
  return '<li><span class="badge t-'+it.tipo+'">'+it.tipo+'</span> '
    + (href ? '<a href="'+href+'" target="_blank" rel="noopener">'+esc(it.titulo)+'</a>' : esc(it.titulo))
    + ' <span class="meta">— '+meta+'</span></li>';
}
const SEC = {aberto:{id:'Aberto', fn:cardHtml, page:9}, previsto:{id:'Previsto', fn:cardHtml, page:9}, noticias:{id:'Noticias', fn:newsHtml, page:15}};
let groups = {}, shown = {};
function drawSection(k){
  const s = SEC[k], arr = groups[k], n = shown[k];
  $('#w'+s.id).hidden = !arr.length;
  $('#n'+s.id).textContent = arr.length;
  $('#l'+s.id).innerHTML = arr.slice(0, n).map(s.fn).join('');
  const more = $('#m'+s.id);
  more.hidden = arr.length <= n;
  more.textContent = 'Ver mais ('+(arr.length - n)+')';
}
function render(list){
  groups = {aberto:[], previsto:[], noticias:[]};
  list.forEach(it => groups[it.tipo === 'Abertura' || it.tipo === 'Alteração' ? 'aberto' : it.tipo === 'Previsto' ? 'previsto' : 'noticias'].push(it));
  $('#total').textContent = list.length;
  $('#totalTxt').textContent = list.length === 1 ? 'resultado' : 'resultados';
  Object.keys(SEC).forEach(k => { shown[k] = SEC[k].page; $('#w'+SEC[k].id).open = true; drawSection(k); });
  $('#result').hidden = false;
}

/* ---------- ação do botão Atualizar ---------- */
async function atualizar(){
  const uf = $('#fUf').value, mun = getMun();
  if(scope === 'municipal' && !uf){ clearResults('Selecione um estado para ver os concursos municipais.'); return; }
  const btn = $('#goBtn'); btn.disabled = true; $('#msg').textContent = 'Atualizando…';
  const [base, live] = await Promise.all([loadBase(), Promise.allSettled(queries(scope, uf, mun).map(q => fetchFeed(q, uf)))]);
  let lidas = 0, aproveitadas = 0;
  live.forEach(r => { if(r.status === 'fulfilled'){ lidas += r.value.lidas; aproveitadas += r.value.items.length; r.value.items.forEach(add); } });
  const aoVivo = live.some(r => r.status === 'fulfilled');
  const list = filtrar(uf, mun);
  render(list);
  $('#msg').textContent = !base && !aoVivo ? 'Não foi possível buscar agora (serviços de acesso ao Google Notícias indisponíveis). Tente novamente em instantes.'
    : !aoVivo ? 'Busca ao vivo indisponível agora; exibindo a base automática.'
    : list.length ? '' : 'Nenhum concurso encontrado com esses filtros ('+lidas+' notícias lidas, '+aproveitadas+' classificadas como concurso).';
  btn.disabled = false;
}

/* ---------- eventos ---------- */
$('#fUf').innerHTML = '<option value=""></option>' + UFS.map(u => '<option value="'+u+'">'+u+' — '+UFNAMES[u]+'</option>').join('');
$('#seg').addEventListener('click', e => { const b = e.target.closest('button[data-scope]'); if(b) setScope(b.dataset.scope); });
$('#fUf').addEventListener('change', () => { if(scope === 'municipal') loadMunicipios($('#fUf').value); });
$('#goBtn').addEventListener('click', atualizar);
$('#result').addEventListener('click', e => { const b = e.target.closest('[data-more]'); if(b){ shown[b.dataset.more] += SEC[b.dataset.more].page; drawSection(b.dataset.more); } });
$('#clearBtn').addEventListener('click', reset);

setScope('nacional');
})();
</script>
</body>
