name: Atualizar concursos

on:
  schedule:
    # a cada 4 horas (horário UTC) — repositório público = minutos do Actions ilimitados e grátis
    - cron: '0 */4 * * *'
  workflow_dispatch: {}   # permite rodar manualmente pela aba "Actions" do GitHub

permissions:
  contents: write

concurrency:
  group: atualizar-concursos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar o scraper
        run: python scripts/atualizar_concursos.py

      - name: Commit do concursos.json (se houver mudança)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: atualiza concursos.json automaticamente'
          commit_user_name: 'concursos-bot'
          commit_user_email: 'actions@users.noreply.github.com'
          file_pattern: concursos.json
