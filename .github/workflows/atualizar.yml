name: Atualizar concursos
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/atualizar_concursos.py
      - name: Salvar concursos.json
        run: |
          git config user.name "robo-concursos"
          git config user.email "robo@users.noreply.github.com"
          git add concursos.json
          git diff --staged --quiet || (git commit -m "Atualiza concursos.json" && git push)
